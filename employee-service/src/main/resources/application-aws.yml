# ECS injects these variables from the Terraform task definition.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:workforce}?useSSL=true&requireSSL=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER}
app:
  security:
    cognito-client-id: ${COGNITO_CLIENT_ID}
  storage:
    s3-bucket: ${DOCUMENT_BUCKET}

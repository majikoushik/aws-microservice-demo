spring:
  application:
    name: leave-service
  profiles:
    default: local
  jpa:
    properties:
      hibernate:
        type:
          preferred_instant_jdbc_type: TIMESTAMP
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    table: leave_flyway_history
server:
  port: ${SERVER_PORT:8082}
app:
  employee-service-url: ${EMPLOYEE_SERVICE_URL:http://localhost:8081}
  outbox:
    poll-ms: 5000
resilience4j:
  circuitbreaker:
    instances:
      employeeDirectory:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-none}]"
